<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id='drum-machine'>
      <div id='pad-bank'>
        <button id='heater1' class='drum-pad'>Q</button>
        <button class='drum-pad' id='heater2'>W</button>
        <button class='drum-pad' id='heater3'>E</button>
        <button class='drum-pad' id='heater4'>A</button>
        <button id='clap' class='drum-pad'>S</button>
        <button class='drum-pad' id='openhh'>D</button>
        <button id='knh' class='drum-pad'>Z</button>
        <button class='drum-pad' id='kick'>X</button>
        <button id='closedhh' class='drum-pad'>C</button>
      </div>
      <p id='display'></p>
    </div>
    <script src='script.js'></script>
  </body>
</html>
